name: Build and Release computerd Desktop Image

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'packages/computerd/**'
      - 'packages/computer/**'
      - 'packages/rpc/**'
      - 'packages/dofs/**'
      - '.github/workflows/build-computerd-image.yml'
      - 'scripts/**'
      - 'install.sh'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Docker Image, Export Tarball & Publish Release
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libfuse-dev

      - name: Install npm dependencies
        run: npm install --ignore-scripts

      - name: Build dofs and rpc packages
        run: |
          npm run build --workspace @cloudflare/dofs
          npm run build --workspace @cloudflare/computer-rpc

      - name: Build computerd daemon bundle
        run: node packages/computerd/scripts/build.mjs

      - name: Verify computerd bundle output
        run: |
          ls -la packages/computerd/dist/cli/
          test -f packages/computerd/dist/cli/computerd.bundle.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Desktop Image
        run: |
          docker build \
            -f packages/computerd/Dockerfile.desktop \
            -t computerd-desktop:latest \
            .

      - name: Export Docker Image to Gzip Tarball
        run: |
          mkdir -p dist-image
          echo "Saving and compressing computerd-desktop:latest..."
          docker save computerd-desktop:latest | gzip > dist-image/computerd-desktop-linux-amd64.tar.gz
          cd dist-image
          sha256sum computerd-desktop-linux-amd64.tar.gz > computerd-desktop-linux-amd64.tar.gz.sha256
          cp ../install.sh ./install.sh
          chmod +x ./install.sh
          ls -lh

      - name: Upload Image Tarball as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: computerd-desktop-linux-amd64
          path: |
            dist-image/computerd-desktop-linux-amd64.tar.gz
            dist-image/computerd-desktop-linux-amd64.tar.gz.sha256
            dist-image/install.sh
          retention-days: 7
          if-no-files-found: error

      - name: Determine Release Tag and Title
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_name=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag_name=continuous" >> $GITHUB_OUTPUT
            echo "release_name=Continuous Desktop Build (Latest)" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.release_info.outputs.is_prerelease == 'false' }}
          generate_release_notes: true
          files: |
            dist-image/computerd-desktop-linux-amd64.tar.gz
            dist-image/computerd-desktop-linux-amd64.tar.gz.sha256
            install.sh
            scripts/install-computer.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
